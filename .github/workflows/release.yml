name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            nasm gcc-multilib binutils dosfstools mtools python3 make gcc-mingw-w64-i686

      - name: Build images
        run: make -j"$(nproc)" all

      - name: Package
        run: |
          mkdir -p dist
          echo "for test run qemu-system-x86_64.exe -accel tcg  -drive format=raw,file=mysticos2.img,if=ide,index=0 -drive format=raw,file=disk2.img,if=ide,index=1 -m 512 -device virtio-vga -device intel-hda -device hda-duplex -serial stdio" > dist/README.txt 
          cp mysticos2.img disk2.img dist/
          cd dist && zip -9 "../mysticos2-${{ github.ref_name }}.zip" *

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "MysticOS 2 ${{ github.ref_name }}"
          generate_release_notes: true
          files: |
            mysticos2.img
            disk2.img
            mysticos2-${{ github.ref_name }}.zip
          fail_on_unmatched_files: true
