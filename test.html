<!DOCTYPE html>
<html>
<head><title>JS Test</title></head>
<body>
<h1>MiniJS Test</h1>
<script>
var x = 10;
var y = 20;
var sum = x + y;
document.write("Sum: " + sum + "<br>");

if (sum > 25) {
  document.write("Sum is big<br>");
} else {
  document.write("Sum is small<br>");
}

for (var i = 0; i < 3; i++) {
  document.write("Loop " + i + "<br>");
}

function greet(name) {
  return "Hello, " + name + "!";
}
document.write(greet("MysticOS") + "<br>");
</script>
</body>
</html>
